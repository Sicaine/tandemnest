name: "inference-api-pricing"
title: "Hosted inference API prices, USD per million tokens"
description: >
  Published per-token prices for hosted language model APIs, read from each provider's
  own pricing page on 19 September 2026. Input and output are listed separately because
  output typically costs several times more and the ratio drives the total.
observed: "2026-09-19"
method: >
  Standard published rates on the observation date, excluding batch discounts, prompt
  caching discounts and negotiated enterprise pricing, all of which change the effective
  price substantially. Where a provider prices by time of day or context length, the
  variant is named in the notes column.
license: "CC BY 4.0"
license_url: "https://creativecommons.org/licenses/by/4.0/"
columns:
  - key: provider
    label: "Provider"
  - key: model
    label: "Model"
  - key: usd_per_m_input
    label: "USD/1M in"
    type: money
    unit: "USD per million input tokens"
  - key: usd_per_m_output
    label: "USD/1M out"
    type: money
    unit: "USD per million output tokens"
  - key: notes
    label: "Notes"
  - key: source
    label: "Source"
    type: url
