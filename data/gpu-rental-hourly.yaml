name: "gpu-rental-hourly"
title: "On-demand GPU rental prices, USD per hour per GPU"
description: >
  Advertised on-demand hourly price for a single GPU, taken from each provider's own
  public pricing page on 19 September 2026. Prices are per GPU, not per instance.
  Marketplace providers are recorded as an observed range rather than a fixed price.
observed: "2026-09-19"
method: >
  Each figure was read from the provider's own pricing page on the observation date.
  Where a provider publishes per-second pricing, the hourly figure is that rate times
  3600. Where a provider sells only multi-GPU instances, the per-GPU figure is the
  instance price divided by the GPU count and is marked as derived. Nothing here is
  estimated or carried over from a previous observation.
license: "CC BY 4.0"
license_url: "https://creativecommons.org/licenses/by/4.0/"
columns:
  - key: provider
    label: "Provider"
  - key: gpu
    label: "GPU"
  - key: usd_per_hour
    label: "USD/hour"
    type: money
    unit: "USD per GPU-hour"
  - key: tier
    label: "Tier or note"
  - key: confidence
    label: "Confidence"
  - key: source
    label: "Source"
    type: url
